<div class="settings-card">
  <div class="toolbar">
    <h2 class="title">פקדי HR מובנים</h2>
    <p-button label="הוספת שדה" icon="pi pi-plus" (onClick)="openAdd()" />
  </div>

  <p-table [value]="fields()" dataKey="idRec">
    <ng-template #header>
      <tr>
        <th>שם שדה</th>
        <th>מפתח נתון (DataKey)</th>
        <th>סוג</th>
        <th>פעיל</th>
        <th></th>
      </tr>
    </ng-template>

    <ng-template #body let-field>
      <tr>
        <td>{{ field.shemSadeh }}</td>
        <td>{{ field.dataKey }}</td>
        <td>{{ field.type }}</td>
        <td>{{ field.isPail ? 'כן' : 'לא' }}</td>
        <td class="actions">
          <p-button icon="pi pi-pencil" [text]="true" [rounded]="true" (onClick)="openEdit(field)" />
          <p-button icon="pi pi-trash" [text]="true" [rounded]="true" severity="danger" (onClick)="confirmDelete(field)" />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="5" class="empty">לא הוגדרו שדות חכמים.</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-dialog
  [header]="isEdit ? 'עריכת שדה' : 'הוספת שדה'"
  [(visible)]="dialogVisible"
  [modal]="true"
  [style]="{ width: '28rem' }">
  <div class="form">
    <label for="shemSadeh">שם שדה</label>
    <input pInputText id="shemSadeh" [(ngModel)]="draft.shemSadeh" />

    <label for="dataKey">מפתח נתון (DataKey)</label>
    <input pInputText id="dataKey" dir="ltr" [(ngModel)]="draft.dataKey" />

    <label for="type">סוג</label>
    <p-select inputId="type" [options]="typeOptions" [(ngModel)]="draft.type" appendTo="body" />

    <div class="switch-row">
      <p-toggleswitch inputId="isPail" [(ngModel)]="draft.isPail" />
      <label for="isPail">פעיל</label>
    </div>
  </div>

  <ng-template #footer>
    <p-button label="ביטול" [text]="true" severity="secondary" (onClick)="dialogVisible = false" />
    <p-button label="שמירה" [disabled]="!isValid" (onClick)="save()" />
  </ng-template>
</p-dialog>

<p-confirmdialog />
