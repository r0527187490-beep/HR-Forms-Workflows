
<div
  class="field-card"
  [class.basic-card]="!isHRName() && !isHRId() && !isHRDepartment()"
  dir="rtl">
  <span class="field-icon" aria-hidden="true">

    <!-- שם עובד -->
    <svg *ngIf="isHRName()" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="8" r="3.5"/>
      <path d="M5 20v-2a7 7 0 0 1 14 0v2z"/>
    </svg>

    <!-- תעודת זהות -->
    <svg *ngIf="isHRId()" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="14" rx="2"/>
      <circle cx="8" cy="11" r="2"/>
      <path d="M5.5 16a3 3 0 0 1 5 0M13 10h5M13 14h5"/>
    </svg>

    <!-- מחלקה ארגונית -->
    <svg *ngIf="isHRDepartment()" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="7" width="18" height="14" rx="1"/>
      <path d="M9 21V3h6v18M3 12h6m6 0h6M3 16h6m6 0h6"/>
    </svg>

    <!-- טקסט קצר -->
    <svg *ngIf="isBasic('text')" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round">
      <path d="M4 6V4h16v2M12 4v16M9 20h6"/>
    </svg>

    <!-- פסקה -->
    <svg *ngIf="isBasic('textarea')" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round">
      <path d="M4 5h16M4 9h16M4 13h12M4 17h12M4 21h8"/>
    </svg>

    <!-- תאריך -->
    <svg *ngIf="isBasic('date')" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5" width="18" height="16" rx="2"/>
      <path d="M16 3v4M8 3v4M3 10h18"/>
    </svg>

    <!-- העלאת קובץ -->
    <svg *ngIf="isBasic('file')" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.7"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 16V4m-5 5 5-5 5 5"/>
      <path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/>
    </svg>

  </span>

  <span class="field-label">{{ field.label }}</span>


</div>
