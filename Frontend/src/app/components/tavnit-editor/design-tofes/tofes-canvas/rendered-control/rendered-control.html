<div class="rendered-control" dir="rtl">
  <!-- כותרת הפקד -->
  <label class="control-label">
    {{ field.label }}
  </label>

  <ng-container [ngSwitch]="field.type">

    <!-- פקדים בסיסיים לפי ה-enum -->
    <input
      *ngSwitchCase="ControlType.Text"
      type="text"
      class="form-input"
      placeholder="הקלידי כאן..." />

    <textarea
      *ngSwitchCase="ControlType.Paragraph"
      class="form-input textarea-input"
      placeholder="הקלידי כאן...">
    </textarea>

    <input
      *ngSwitchCase="ControlType.Date"
      type="date"
      class="form-input" />

    <input
      *ngSwitchCase="ControlType.File"
      type="file"
      class="form-input file-input" />

    <!-- שדות HR לפי ה-enum -->
    <input
      *ngSwitchCase="ControlType.HR_Name"
      type="text"
      class="form-input smart-input"
      readonly
      [placeholder]="smartPlaceholder" />

    <input
      *ngSwitchCase="ControlType.HR_Id"
      type="text"
      class="form-input smart-input"
      readonly
      [placeholder]="smartPlaceholder" />

    <input
      *ngSwitchCase="ControlType.HR_Department"
      type="text"
      class="form-input smart-input"
      readonly
      [placeholder]="smartPlaceholder" />

    <!-- תמיכה בשדות HR ישנים אם הם מגיעים כמחרוזות -->
    <input
      *ngSwitchCase="'HR_Name'"
      type="text"
      class="form-input smart-input"
      readonly
      [placeholder]="smartPlaceholder" />

    <input
      *ngSwitchCase="'HR_Id'"
      type="text"
      class="form-input smart-input"
      readonly
      [placeholder]="smartPlaceholder" />

    <input
      *ngSwitchCase="'HR_Department'"
      type="text"
      class="form-input smart-input"
      readonly
      [placeholder]="smartPlaceholder" />

    <input
      *ngSwitchCase="'employeeName'"
      type="text"
      class="form-input smart-input"
      readonly
      [placeholder]="smartPlaceholder" />

    <input
      *ngSwitchCase="'employeeId'"
      type="text"
      class="form-input smart-input"
      readonly
      [placeholder]="smartPlaceholder" />

    <input
      *ngSwitchCase="'department'"
      type="text"
      class="form-input smart-input"
      readonly
      [placeholder]="smartPlaceholder" />

    <!-- סוג פקד לא מזוהה -->
    <p *ngSwitchDefault class="unknown-control">
      סוג פקד לא מוכר: {{ field.type }}
    </p>

  </ng-container>
</div>
