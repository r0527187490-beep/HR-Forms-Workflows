<div class="rendered-control" dir="rtl">

  <!-- כותרת הפקד -->
  <div class="control-label">

    <!-- פקד בסיסי בעורך: כותרת ניתנת לעריכה -->
    <input
      *ngIf="canEditLabel"
      type="text"
      class="control-label-input"
      [value]="field.label"
      placeholder="הקלידי שם לפקד"
      (input)="onLabelChange($event)" />

    <!-- פקד חכם או תצוגה מקדימה: טקסט בלבד -->
    <span *ngIf="!canEditLabel">{{ field.label }}</span>

  </div>

  <!-- פקד חכם: קלט נעול -->
  <input
    *ngIf="isSmartField"
    type="text"
    class="form-input smart-input"
    readonly
    [placeholder]="smartPlaceholder" />

  <!-- פקדים בסיסיים -->
  <ng-container *ngIf="!isSmartField" [ngSwitch]="field.type">

    <input
      *ngSwitchCase="ControlType.Text"
      type="text"
      class="form-input"
      placeholder="הקלידי כאן..." />

    <textarea
      *ngSwitchCase="ControlType.Paragraph"
      class="form-input textarea-input"
      placeholder="הקלידי כאן..."></textarea>

    <input
      *ngSwitchCase="ControlType.Date"
      type="date"
      class="form-input" />

    <input
      *ngSwitchCase="ControlType.File"
      type="file"
      class="form-input file-input" />

    <input
      *ngSwitchCase="ControlType.Number"
      type="number"
      class="form-input"
      placeholder="הקלידי מספר..." />

    <p *ngSwitchDefault class="unknown-control">
      סוג פקד לא מוכר: {{ field.type }}
    </p>

  </ng-container>
</div>
